appId: com.sweetbitscreative.mirrorcat
productName: MirrorCat
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
# The shape finder's native runtime can't load from inside app.asar.
asarUnpack:
  - node_modules/onnxruntime-node/**
mac:
  category: public.app-category.graphics-design
  target: dmg
win:
  target: nsis
linux:
  target: AppImage

# Packaged-build hardening (Electron fuses, flipped in the binary itself):
# no running the app as plain Node, no NODE_OPTIONS / --inspect injection,
# and the app only loads from its own integrity-checked app.asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
